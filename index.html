<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header class="flex justify-between items-center py-4 px-15 bg-purple-500">
        <input class="h-10 w-100 pl-4 rounded bg-white" type="text" placeholder="Pesquisar"/>
        <button class="cursor-pointer leading-10 bg-purple-800 rounded px-4 font-bold text-white duration-200 hover:bg-purple-400 hover:text-black">Nova Tarefa</button>
    </header>
    <main class="p-15 bg-slate-200">
        <dialog class="w-5 h-20">
          <input type="text" class="h-10 w-3 pl-1 rounded bg-white" placeholder="Título da Tarefa"/>
          <input type="text" class="h-10 w-3 pl-1 rounded bg-white" placeholder="Descição da Tarefa"/>
          <button class="cursor-pointer leading-10 bg-purple-800 rounded px-4 font-bold text-white duration-200 hover:bg-purple-400 hover:text-black">Criar Tarefa</button>
          
        </dialog>
        <h1 class="text-3xl font-bold mb-6">Tarefas</h1>
        <div id="tarefas" class="grid grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-lg">
                <h3 class="font-bold mb-4">Titulo do card</h3>
                <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Aut reprehenderit dolores nemo, neque consequatur excepturi quaerat expedita doloremque rem praesentium vitae laborum sed vel ea ad animi aliquid minus reiciendis!</p>
            </div>
        </div>
    </main>

    <script src="./index.js"></script>
</body>
</html>
